<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>GymBRO Signup</title>

  <link rel="stylesheet"
  href="../css/auth.css">

</head>

<body>

  <div class="signup-container">

    <h1>
      GymBRO 💪
    </h1>

    <form id="signupForm">

      <input
      type="text"
      id="firstName"
      placeholder="First Name"
      required>


      <input
      type="text"
      id="lastName"
      placeholder="Last Name"
      required>


      <input
      type="email"
      id="email"
      placeholder="Email"
      required>


      <input
      type="password"
      id="password"
      placeholder="Password"
      required>


      <input
      type="number"
      id="age"
      placeholder="Age"
      required>


      <input
      type="number"
      id="bodyWeight"
      placeholder="Body Weight (kg)"
      required>


      <input
      type="number"
      id="height"
      placeholder="Height (cm)"
      required>


      <select id="gender" required>

        <option value="">
          Select Gender
        </option>

        <option value="Male">
          Male
        </option>

        <option value="Female">
          Female
        </option>

      </select>


      <button type="submit">

        Signup

      </button>

    </form>


    <p>

      Already have an account?

      <a href="./login.html">

        Login

      </a>

    </p>

  </div>


  <script src="../js/auth.js"></script>

</body>
</html>
