<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>GymBRO Dashboard</title>

  <link rel="stylesheet"
  href="../css/dashboard.css">

</head>

<body>

  <!-- NAVBAR -->

  <nav>

    <div class="logo">
      GymBRO 💪
    </div>

    <ul>

      <li class="active">
        Dashboard
      </li>

      <li>

        <a href="/pages/progress.html">

          Progress

        </a>

      </li>

      <li>

        <a href="/pages/profile.html">

          Profile

        </a>

      </li>

    </ul>

    <div id="logoutBtn">

      Logout →

    </div>

  </nav>


  <!-- HERO -->

  <section class="hero">

    <h1 id="welcomeText">

      Hello User 👋

    </h1>

    <p>

      Ready to crush today's workout?

    </p>

  </section>


  <!-- STREAK -->

  <section class="streak-container">

    <div class="streak-card">

      <h2>

        🔥 Gym Streak

      </h2>

      <p id="streakText">

        0 Days

      </p>

    </div>

  </section>


  <!-- BODY PARTS -->

  <section class="body-grid">


    <div class="body-card chest">

      <div class="overlay"></div>

      <h2>Chest</h2>

    </div>


    <div class="body-card biceps">

      <div class="overlay"></div>

      <h2>Biceps</h2>

    </div>


    <div class="body-card triceps">

      <div class="overlay"></div>

      <h2>Triceps</h2>

    </div>


    <div class="body-card back">

      <div class="overlay"></div>

      <h2>Back</h2>

    </div>


    <div class="body-card legs">

      <div class="overlay"></div>

      <h2>Legs</h2>

    </div>


    <div class="body-card shoulders">

      <div class="overlay"></div>

      <h2>Shoulders</h2>

    </div>


    <div class="body-card abs">

      <div class="overlay"></div>

      <h2>Abs</h2>

    </div>

  </section>


  <script src="../js/dashboard.js"></script>

</body>
</html>
