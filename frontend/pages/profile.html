<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Profile</title>

  <link rel="stylesheet"
  href="../css/profile.css">

</head>

<body>

  <div class="profile-container">

    <h1>
      My Profile 👤
    </h1>


    <div class="profile-card">

      <h2 id="fullName">

        User Name

      </h2>


      <p id="age">

        Age:

      </p>


      <p id="gender">

        Gender:

      </p>


      <p id="height">

        Height:

      </p>


      <p id="weight">

        Weight:

      </p>


      <p id="bmi">

        BMI:

      </p>


      <p id="workoutCount">

        Total Workouts:

      </p>


      <button id="logoutBtn">

        Logout

      </button>

    </div>

  </div>


  <script src="../js/profile.js">

  </script>

</body>
</html>
